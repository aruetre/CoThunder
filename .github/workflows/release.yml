name: Release XPI

# Publica el .xpi en la página de Releases al empujar una etiqueta vX.Y.Z.
# También se puede lanzar a mano (workflow_dispatch) para obtener el .xpi como artefacto.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Validar manifest y sintaxis JS
        run: |
          node -e "const m=JSON.parse(require('fs').readFileSync('manifest.json'));if(!/^[0-9]+\.[0-9]+\.[0-9]+$/.test(m.version))throw new Error('version no SemVer: '+m.version);console.log('manifest OK, version '+m.version)"
          for f in common.js background.js content-copilot.js content-compose.js markdown.js popup/popup.js options/options.js; do node --check "$f" && echo "$f OK"; done
          node --test

      - name: Verificar que existen los ficheros de la extensión
        run: |
          for f in manifest.json common.js background.js content-copilot.js content-compose.js markdown.js compose.css \
                   popup/popup.html popup/popup.js popup/popup.css \
                   options/options.html options/options.js icon.svg; do
            test -f "$f" || { echo "FALTA: $f"; exit 1; }
          done
          echo "Ficheros de la extensión OK"

      - name: Empaquetar XPI
        id: pack
        run: |
          VERSION=$(node -p "JSON.parse(require('fs').readFileSync('manifest.json')).version")
          XPI="cothunder-${VERSION}.xpi"
          zip -r "$XPI" manifest.json common.js background.js content-copilot.js content-compose.js markdown.js compose.css icon.svg popup options -x '*.md'
          echo "Contenido del paquete:"
          unzip -l "$XPI"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "xpi=$XPI" >> "$GITHUB_OUTPUT"

      - name: Subir el .xpi como artefacto del workflow (solo en ejecución manual)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v5
        with:
          name: cothunder-xpi
          path: ${{ steps.pack.outputs.xpi }}

      - name: Crear o actualizar la Release y adjuntar el .xpi
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ github.ref_name }}"
          XPI="${{ steps.pack.outputs.xpi }}"
          VERSION="${{ steps.pack.outputs.version }}"
          TITLE="CoThunder ${VERSION}"
          # Notas de la release: extrae la sección de esta versión del CHANGELOG y añade la instalación.
          {
            awk -v ver="$VERSION" 'substr($0,1,4)=="## [" { if(p) exit; if(index($0,"## [" ver "]")==1){p=1;next} } p{print}' CHANGELOG.md
            echo ""
            echo "---"
            echo ""
            echo "Requiere **Thunderbird 140 o superior**. Instalación: descarga \`$XPI\` de más abajo y, en Thunderbird, ve a Herramientas › Complementos y temas › engranaje › Instalar complemento desde archivo."
          } > RELEASE_NOTES.md
          if [ ! -s RELEASE_NOTES.md ]; then echo "CoThunder ${VERSION} para Thunderbird 140 o superior." > RELEASE_NOTES.md; fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --title "$TITLE" --notes-file RELEASE_NOTES.md
            gh release upload "$TAG" "$XPI" --clobber
          else
            gh release create "$TAG" "$XPI" --title "$TITLE" --notes-file RELEASE_NOTES.md
          fi
